<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CircleSafe">
  <defs>
    <linearGradient id="csTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34E0A1"/>
      <stop offset="0.55" stop-color="#0FA968"/>
      <stop offset="1" stop-color="#0B8452"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#csTile)"/>
  <!-- the circle: open ring = the rotation, gap at the top right -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="#FFFFFF" stroke-width="6.5"
          stroke-linecap="round" stroke-dasharray="85.4 21.4"/>
  <!-- safe: two-party confirmation -->
  <path d="M24.5 32.8 L29.8 38 L39.5 26.5" fill="none" stroke="#FFFFFF" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the pot, sitting on the member whose turn it is -->
  <circle cx="37.25" cy="15.85" r="5.4" fill="#F5B301"/>
</svg>
